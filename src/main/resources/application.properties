server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,com.flowingcode,com.github.laplusijns
spring.jpa.defer-datasource-initialization = true

# PaddleX is the primary invoice OCR provider. The existing multimodal AI OCR is
# used only when PaddleX is unavailable or cannot extract both required fields.
invoice.ocr.paddlex.base-url=${PADDLEX_BASE_URL:http://127.0.0.1:16601}
invoice.ocr.paddlex.endpoint=${PADDLEX_ENDPOINT:/ocr}
invoice.ocr.paddlex.connect-timeout=${PADDLEX_CONNECT_TIMEOUT:2s}
invoice.ocr.paddlex.read-timeout=${PADDLEX_READ_TIMEOUT:60s}
